<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>সাইবার সিকিউরিটি হেল্প সেন্টার</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #141824;
            padding: 40px 35px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 500px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2f42;
        }

        .logo-area {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #a8b2d1;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .logo-area span {
            background: #1e2337;
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #2f3650;
            color: #ccd6f6;
        }

        .zone-tag {
            font-size: 38px;
            font-weight: 800;
            color: #e6f1ff;
            background: #1b2136;
            display: inline-block;
            padding: 8px 32px;
            border-radius: 50px;
            border: 1px solid #3b4363;
            margin: 8px 0 18px 0;
            letter-spacing: 6px;
        }

        .white-line {
            width: 100%;
            height: 2px;
            background: #ffffff;
            margin: 16px 0 26px 0;
            opacity: 0.2;
            border-radius: 10px;
        }

        .input-area label {
            color: #a8b2d1;
            font-size: 16px;
            font-weight: 500;
            display: block;
            margin-bottom: 12px;
        }

        .input-area input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: none;
            background: #1e2339;
            color: #ffffff;
            font-size: 18px;
            text-align: center;
            outline: 2px solid #2f3652;
            transition: 0.2s;
        }

        .input-area input:focus {
            outline: 2px solid #4c8bf5;
        }

        .input-area input::placeholder {
            color: #5a6382;
            font-size: 15px;
        }

        /* Canvas যেখানে ছবি তৈরি হবে */
        .canvas-wrapper {
            margin-top: 22px;
            background: #0f1322;
            padding: 15px;
            border-radius: 20px;
            border: 1px dashed #2f3652;
            display: none;
        }

        .canvas-wrapper.show {
            display: block;
        }

        #nameCanvas {
            width: 100%;
            height: auto;
            border-radius: 12px;
            background: #0b0e1a;
        }

        .download-btn {
            margin-top: 14px;
            background: #00ff88;
            color: #0b0e1a;
            border: none;
            padding: 12px 30px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: none;
        }

        .download-btn:hover {
            background: #00cc6a;
            transform: scale(1.03);
        }

        .download-btn.show {
            display: inline-block;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #3f486b;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="logo-area">
        <span>🛡️ EXPERIENCE</span>
        <span>🏛️ PUBLIC HELP CENTRE</span>
        <span>🔒 EXPERT CYBER SECURITY</span>
        <span>📞 HELP</span>
    </div>

    <div class="zone-tag">08</div>

    <div class="white-line"></div>

    <div class="input-area">
        <label for="nameInput">👇 এখানে আপনার নাম লিখুন</label>
        <input type="text" id="nameInput" placeholder="যেমন: Rashd" />
    </div>

    <!-- Canvas এর জায়গা -->
    <div class="canvas-wrapper" id="canvasWrapper">
        <canvas id="nameCanvas" width="800" height="400"></canvas>
        <button class="download-btn" id="downloadBtn">⬇️ HD ছবি ডাউনলোড করুন</button>
    </div>

    <div class="footer">✅ নাম দিলেই HD কোয়ালিটির ছবি তৈরি হবে</div>
</div>

<script>
    const input = document.getElementById('nameInput');
    const canvas = document.getElementById('nameCanvas');
    const ctx = canvas.getContext('2d');
    const wrapper = document.getElementById('canvasWrapper');
    const downloadBtn = document.getElementById('downloadBtn');

    // ফাংশন: ছবি তৈরি করবে
    function generateImage(name) {
        const canvasWidth = 800;
        const canvasHeight = 400;

        canvas.width = canvasWidth;
        canvas.height = canvasHeight;

        // ব্যাকগ্রাউন্ড (ডার্ক থিম)
        const gradient = ctx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
        gradient.addColorStop(0, '#0b0e1a');
        gradient.addColorStop(1, '#141824');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, canvasWidth, canvasHeight);

        // বর্ডার
        ctx.strokeStyle = '#2f3650';
        ctx.lineWidth = 3;
        ctx.strokeRect(10, 10, canvasWidth - 20, canvasHeight - 20);

        // শিরোনাম (EXPERIENCE, HELP ইত্যাদি)
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        ctx.font = 'bold 28px "Segoe UI", Tahoma, sans-serif';
        ctx.fillStyle = '#a8b2d1';
        ctx.fillText('⚡ EXPERIENCE  •  PUBLIC HELP CENTRE  •  EXPERT CYBER SECURITY  •  HELP', canvasWidth/2, 70);

        // ZONE 08
        ctx.font = 'bold 48px "Segoe UI", Tahoma, sans-serif';
        ctx.fillStyle = '#e6f1ff';
        ctx.fillText('08', canvasWidth/2, 140);

        // সাদা রেখা
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.2;
        ctx.beginPath();
        ctx.moveTo(100, 175);
        ctx.lineTo(canvasWidth - 100, 175);
        ctx.stroke();
        ctx.globalAlpha = 1.0;

        // ইউজারের নাম (বড় ও HD)
        ctx.font = 'bold 72px "Segoe UI", Tahoma, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = '#00ff88';
        ctx.shadowBlur = 30;
        ctx.fillStyle = '#00ff88';
        ctx.fillText(name, canvasWidth/2, 280);

        // নিচে ছোট ফুটার
        ctx.shadowBlur = 0;
        ctx.font = '16px "Segoe UI", Tahoma, sans-serif';
        ctx.fillStyle = '#3f486b';
        ctx.fillText('✅ সাইবার সিকিউরিটি হেল্প সেন্টার', canvasWidth/2, 370);

        wrapper.classList.add('show');
        downloadBtn.classList.add('show');
    }

    // ইনপুটে নাম দিলেই ছবি তৈরি হবে
    input.addEventListener('input', function () {
        const name = this.value.trim();

        if (name === '') {
            wrapper.classList.remove('show');
            downloadBtn.classList.remove('show');
            return;
        }

        generateImage(name);
    });

    // ডাউনলোড বাটন
    downloadBtn.addEventListener('click', function () {
        const link = document.createElement('a');
        link.download = `সাইবার_সিকিউরিটি_${input.value.trim()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
  </html>
