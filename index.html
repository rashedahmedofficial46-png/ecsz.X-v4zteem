<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>সাইবার সিকিউরিটি হেল্প সেন্টার</title>
    <style>
        /* পুরো পেজের স্টাইল */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0e1a;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: #141824;
            padding: 40px 35px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid #2a2f42;
        }

        /* লোগো ইমেজ */
        .logo-image {
            width: 100%;
            max-width: 300px;
            height: auto;
            border-radius: 16px;
            margin-bottom: 16px;
            border: 1px solid #2f3650;
        }

        /* টেক্সট লোগো (যদি ইমেজের সাথে রাখতে চান) */
        .logo-area {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #a8b2d1;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .logo-area span {
            background: #1e2337;
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid #2f3650;
            color: #ccd6f6;
        }

        /* ZONE ট্যাগ */
        .zone-tag {
            font-size: 38px;
            font-weight: 800;
            color: #e6f1ff;
            background: #1b2136;
            display: inline-block;
            padding: 8px 32px;
            border-radius: 50px;
            border: 1px solid #3b4363;
            margin: 8px 0 18px 0;
            letter-spacing: 6px;
        }

        /* সাদা রেখা */
        .white-line {
            width: 100%;
            height: 2px;
            background: #ffffff;
            margin: 16px 0 26px 0;
            opacity: 0.2;
            border-radius: 10px;
        }

        /* ইনপুট ফিল্ড */
        .input-area label {
            color: #a8b2d1;
            font-size: 16px;
            font-weight: 500;
            display: block;
            margin-bottom: 12px;
        }

        .input-area input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 40px;
            border: none;
            background: #1e2339;
            color: #ffffff;
            font-size: 18px;
            text-align: center;
            outline: 2px solid #2f3652;
            transition: 0.2s;
        }

        .input-area input:focus {
            outline: 2px solid #4c8bf5;
        }

        .input-area input::placeholder {
            color: #5a6382;
            font-size: 15px;
        }

        /* সবুজ নাম দেখানোর বক্স */
        .name-output {
            margin-top: 22px;
            font-size: 28px;
            font-weight: 700;
            min-height: 50px;
            background: #0f1322;
            padding: 14px 10px;
            border-radius: 30px;
            border: 1px dashed #2f3652;
            color: #00ff88;
            word-break: break-word;
            transition: 0.2s;
        }

        .name-output.empty {
            color: #3d4560;
            font-weight: 400;
            font-size: 16px;
        }

        .footer {
            margin-top: 20px;
            font-size: 12px;
            color: #3f486b;
        }
    </style>
</head>
<body>

<div class="card">

    <!-- ===== লোগো ইমেজ ===== -->
    <img src="IMG-20260906-WA0050.jpg" alt="Logo" class="logo-image" />

    <!-- ===== টেক্সট লোগো (ঐচ্ছিক) ===== -->
    <div class="logo-area">
        <span>🛡️ EXPERIENCE</span>
        <span>🏛️ PUBLIC HELP CENTRE</span>
        <span>🔒 EXPERT CYBER SECURITY</span>
        <span>📞 HELP</span>
    </div>

    <!-- ZONE ট্যাগ -->
    <div class="zone-tag">08</div>

    <!-- সাদা রেখা -->
    <div class="white-line"></div>

    <!-- ===== নাম লেখার অংশ ===== -->
    <div class="input-area">
        <label for="nameInput">👇 এখানে আপনার নাম লিখুন</label>
        <input type="text" id="nameInput" placeholder="যেমন: রাফি" />

        <div id="nameDisplay" class="name-output empty">নাম দেখাবে সবুজে</div>
    </div>

    <div class="footer">✅ লিখলেই সবুজ হয়ে যাবে</div>
</div>

<script>
    const input = document.getElementById('nameInput');
    const display = document.getElementById('nameDisplay');

    input.addEventListener('input', function () {
        const name = this.value.trim();

        if (name === '') {
            display.textContent = 'নাম দেখাবে সবুজে';
            display.classList.add('empty');
        } else {
            display.textContent = name;
            display.classList.remove('empty');
        }
    });
</script>

</body>
</html>
